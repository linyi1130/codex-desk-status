; Classic LilyGO T-Display-S3 (ESP32-S3, ST7789 170x320, 8-bit parallel).
; Not the AMOLED or Pro board. Board id in this PlatformIO release is lilygo-t-display-s3.

[platformio]
default_envs = lilygo-t-display-s3

[env:lilygo-t-display-s3]
platform = espressif32@6.5.0
board = lilygo-t-display-s3
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_deps =
  lovyan03/LovyanGFX@1.2.36
  bblanchon/ArduinoJson@7.4.3
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=1
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
monitor_filters = esp32_exception_decoder
